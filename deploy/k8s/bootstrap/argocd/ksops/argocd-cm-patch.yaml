apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Required for KSOPS: kustomize must be allowed to run exec plugins.
  kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
