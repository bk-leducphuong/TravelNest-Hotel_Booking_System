apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travelnest-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bk-leducphuong/TravelNest.git
    targetRevision: master
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
