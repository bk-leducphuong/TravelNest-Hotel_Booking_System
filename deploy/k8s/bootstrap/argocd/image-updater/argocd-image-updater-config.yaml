# Overrides for the ConfigMap created by the Image Updater installer.
# Applied with `kubectl apply`, so keys from the installer's ConfigMap
# (e.g. registries.conf) are preserved.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater
data:
  log.level: info
  git.commit-message-template: |-
    chore(deploy): update {{ .AppName }} image

    {{ range .AppChanges -}}
    updates image {{ .Image }} tag '{{ .OldTag }}' to '{{ .NewTag }}'
    {{ end -}}
