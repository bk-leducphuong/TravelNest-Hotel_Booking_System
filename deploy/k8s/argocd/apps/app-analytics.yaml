apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travelnest-analytics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: travelnest
  source:
    repoURL: https://github.com/bk-leducphuong/TravelNest.git
    targetRevision: master
    path: deploy/k8s/apps/analytics/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: travelnest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
