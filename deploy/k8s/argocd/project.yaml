apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: travelnest
  namespace: argocd
spec:
  description: TravelNest application and infrastructure
  sourceRepos:
    - '*'
  destinations:
    - namespace: travelnest
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
