apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: travelnest
  namespace: argocd
  annotations:
    # Created before the ApplicationSet so its child Applications have a valid
    # project when they are first reconciled.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: TravelNest application and infrastructure
  # Only this repository may be deployed by the project (previously '*').
  sourceRepos:
    - https://github.com/bk-leducphuong/TravelNest-Hotel_Booking_System.git
  destinations:
    - namespace: travelnest
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  # Child Applications only create namespaced workloads. Namespace is allowed
  # so the CreateNamespace sync option keeps working. The two rbac kinds are for
  # stakater/reloader, which needs cluster-scoped RBAC to watch Secrets/ConfigMaps
  # and patch the workloads that reference them (see infra/reloader).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  # Explicit allow-list of the resource kinds the overlays render (previously '*').
  #
  # NOTE: in Argo CD the project whitelist ALSO filters the UI resource tree —
  # any child whose GroupKind isn't listed is hidden, even if it exists. So
  # apps/ReplicaSet and Pod are included (even though the overlays never declare
  # them) so a Deployment's ReplicaSet/Pod children render in the tree and the
  # per-resource "Logs" tab is available. This affects observability only, not
  # what Argo is allowed to deploy. See argoproj/argo-cd#28564.
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Pod
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: Ingress
    - group: ""
      kind: PersistentVolumeClaim
