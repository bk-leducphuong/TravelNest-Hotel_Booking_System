apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - applicationset.yaml
  # Standalone Application (project `default`: needs cluster-scoped RBAC). It is
  # a plain resource of the root app, not an ApplicationSet entry, because the
  # ApplicationSet template targets the `travelnest` project/namespace.
  - monitoring.yaml
  # Argo CD manages itself from the argo/argo-cd chart. Same reason for
  # project `default`; see the file's header for bootstrap/upgrade notes.
  - argocd.yaml
