# Intentionally NOT automated: sync this only after travelnest-local-infra is
# Healthy, so the workloads do not start before MySQL/Redis/Keycloak/Mongo/ES.
#
#   argocd app sync travelnest-local-apps
#
# Flip on `spec.syncPolicy.automated` once you are happy to let it self-heal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travelnest-local-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: travelnest-local
spec:
  project: default
  source:
    repoURL: https://github.com/bk-leducphuong/TravelNest-Hotel_Booking_System.git
    targetRevision: develop
    path: deploy/k8s/local/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: travelnest
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
