# Union of the local environment (kept for `kubectl apply -k deploy/k8s/local`).
#
# Argo CD splits this into two Applications so the data layer can be brought up
# and verified before the workloads:
#   - deploy/k8s/local/infra  -> travelnest-local-infra
#   - deploy/k8s/local/apps   -> travelnest-local-apps
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - infra
  - apps
