# Creates the base schema with sequelize.sync (the 14 migrations only add
# incremental tables and assume the base tables already exist). Run this FIRST,
# then migrate, then seed.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  labels:
    app.kubernetes.io/name: db-init
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: travelnest-api:develop
          imagePullPolicy: IfNotPresent
          command: ["node", "infra/database/init.js"]
          env:
            - name: NODE_ENV
              value: production
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
