apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
type: Opaque
stringData:
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_PASSWORD: ${DB_PASSWORD}
  MYSQL_DSN: travelnest:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/travelnest?parseTime=true
  SMTP_HOST: ${SMTP_HOST}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASS: ${SMTP_PASS}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
