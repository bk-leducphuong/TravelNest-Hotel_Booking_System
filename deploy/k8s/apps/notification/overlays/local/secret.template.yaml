apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
type: Opaque
stringData:
  DB_PASSWORD: ${DB_PASSWORD}
  MYSQL_DSN: travelnest:${DB_PASSWORD}@tcp(mysql:3306)/travelnest?parseTime=true
  SMTP_HOST: ${SMTP_HOST}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASS: ${SMTP_PASS}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
