apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-client
spec:
  ingressClassName: traefik
  rules:
    - host: admin.deployserver.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-client
                port:
                  number: 80
