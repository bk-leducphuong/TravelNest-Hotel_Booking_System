apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-client
    spec:
      containers:
        - name: admin-client
          image: travelnest-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
