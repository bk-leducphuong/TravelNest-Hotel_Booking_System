apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travelnest
resources:
  - ../../base
  - configmap.yaml
images:
  - name: travelnest-analytics
    newName: docker.io/leducphuong/travelnest-analytics
    # Managed by Argo CD Image Updater: rewritten to an immutable
    # sha-<commit> tag. Do not hand-edit unless Image Updater is disabled.
    newTag: latest
generators:
  - secret-generator.yaml
