apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travelnest
resources:
  - ../../base
  - ingress.yaml
images:
  - name: travelnest-frontend
    newName: docker.io/leducphuong/travelnest-frontend
    # Local dev tracks the CI-built 'develop' tag ('latest' is master-only).
    newTag: develop
