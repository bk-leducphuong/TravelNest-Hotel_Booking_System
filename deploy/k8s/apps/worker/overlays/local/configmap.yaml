apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
data:
  NODE_ENV: production
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: travelnest
  DB_NAME: travelnest
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "1"
  NATS_URL: nats://nats:4222
  NATS_STREAM: TRAVELNEST_ANALYTICS
  NATS_CLIENT_NAME: travelnest-worker
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_BUCKET: uploads
  MINIO_USE_SSL: "false"
  WORKER_HEALTH_PORT: "4001"
  REDIS_USERNAME: ""
  # Payout automation is opt-in. Keep off locally unless testing the scheduler.
  PAYOUT_AUTO_GENERATE: "false"
  PAYOUT_AUTO_PROCESS: "false"
  PAYOUT_GENERATION_INTERVAL_MS: "86400000"
  PAYOUT_PROCESSING_INTERVAL_MS: "300000"
  PAYOUT_HOLD_DAYS: "7"
  PAYOUT_MIN_AMOUNT: "0"
  PAYOUT_STALE_MINUTES: "60"
  PAYOUT_BATCH_SIZE: "500"
  PAYOUT_RECOVERY_BATCH_SIZE: "50"
