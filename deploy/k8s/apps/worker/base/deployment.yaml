apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      containers:
        - name: worker
          image: travelnest-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - run
            - start:bullmq-worker
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: worker-secret
          ports:
            - containerPort: 4001
              name: health
          # The worker only starts its health server after every BullMQ worker
          # has initialised (which can take ~a minute), so a startupProbe gates
          # liveness/readiness until then rather than letting liveness kill it
          # mid-startup.
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
