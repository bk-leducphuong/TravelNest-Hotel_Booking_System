apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  annotations:
    # Roll pods when a referenced ConfigMap/Secret changes — env-var secrets do
    # not hot-reload. See deploy/k8s/infra/reloader.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
      annotations:
        # BullMQ job-duration metrics share the health port (4001). Scraped by
        # the Alloy collector via annotationAutodiscovery.
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/job: travelnest-worker
        k8s.grafana.com/metrics.portName: health
        k8s.grafana.com/metrics.path: /metrics
    spec:
      containers:
        - name: worker
          image: travelnest-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - run
            - start:bullmq-worker
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: worker-secret
          env:
            # Payout automation creates Stripe transfers from the worker. Reuse
            # the API's Stripe key so both processes are configured identically;
            # the worker secret intentionally does not duplicate payment keys.
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: STRIPE_SECRET_KEY
          ports:
            - containerPort: 4001
              name: health
          # The worker only starts its health server after every BullMQ worker
          # has initialised (which can take ~a minute), so a startupProbe gates
          # liveness/readiness until then rather than letting liveness kill it
          # mid-startup.
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
