apiVersion: v1
kind: ConfigMap
metadata:
  name: media-config
data:
  HTTP_ADDR: :8082
  DB_USER: travelnest
  DB_NAME: travelnest
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: uploads
  MINIO_USE_SSL: "false"
  PUBLIC_OBJECT_BASE_URL: http://storage.travelnest.local/uploads
  NATS_URL: nats://nats:4222
  NATS_STREAM: TRAVELNEST_MEDIA
  LOG_LEVEL: info
  MAX_UPLOAD_BYTES: "5242880"
