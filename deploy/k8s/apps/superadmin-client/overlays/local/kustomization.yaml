apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travelnest
resources:
  - ../../base
  - ingress.yaml
images:
  - name: travelnest-superadmin
    newName: docker.io/leducphuong/travelnest-superadmin
    # Local dev tracks the CI-built 'develop' tag ('latest' is master-only).
    newTag: latest
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
