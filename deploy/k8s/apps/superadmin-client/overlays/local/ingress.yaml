apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superadmin-client
spec:
  ingressClassName: traefik
  rules:
    - host: superadmin.travelnest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superadmin-client
                port:
                  number: 80
