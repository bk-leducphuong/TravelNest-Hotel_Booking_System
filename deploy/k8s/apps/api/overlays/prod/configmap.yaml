apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  NODE_ENV: production
  # Swagger UI at /api-docs. Publicly routable, but Cloudflare Access guards
  # /api-docs and /api-docs.json (self-hosted apps "TravelNest API Docs" and
  # "TravelNest API Docs JSON"). Everything else on the API stays public.
  ENABLE_API_DOCS: "true"
  PORT: "3000"
  # Prometheus metrics listener, scraped in-cluster only (see the pod
  # annotations in deploy/k8s/apps/api/base/deployment.yaml).
  METRICS_PORT: "9464"
  CLIENT_HOST: https://trestay.com
  ADMIN_CLIENT_HOST: https://admin.trestay.com
  SUPERADMIN_CLIENT_HOST: https://superadmin.trestay.com
  DB_USER: travelnest
  DB_NAME: travelnest
  REDIS_DB: "1"
  NATS_URL: nats://nats:4222
  NATS_STREAM: TRAVELNEST_ANALYTICS
  NATS_CLIENT_NAME: travelnest-api
  ANALYTICS_SERVICE_URL: http://analytics:8081
  MEDIA_SERVICE_URL: http://media:8082
  NOTIFICATION_SERVICE_URL: http://notification:8083
  ANALYTICS_SERVICE_TIMEOUT_MS: "2000"
  MEDIA_SERVICE_TIMEOUT_MS: "30000"
  NOTIFICATION_SERVICE_TIMEOUT_MS: "10000"
  API_BASE_URL: https://api.trestay.com/api/v1
  EXTERNAL_BASE_URL: https://api.trestay.com
  KEYCLOAK_ISSUER: https://keycloak.trestay.com/realms/travelnest
  KEYCLOAK_CLIENT_ID: travelnest-web
  KEYCLOAK_AUDIENCE: travelnest-web
  KEYCLOAK_CLOCK_SKEW_SECONDS: "60"
  # Server-to-Keycloak calls (JWKS, userinfo) must reach Keycloak directly
  # in-cluster. The public issuer is fronted by Cloudflare, which challenges
  # non-browser requests from the VPS egress with HTTP 403 — that broke JWT
  # verification (the API fell back to an invalid static key and rejected every
  # bearer token). KEYCLOAK_ISSUER stays the public URL for `iss` validation.
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/travelnest
  WORKER_HEALTH_PORT: "4001"
  REDIS_USERNAME: ""
  # One trusted hop (Traefik) in front of the API. Visitor identity for rate
  # limiting does NOT come from here — it comes from CF-Connecting-IP, because
  # cloudflared sits between Cloudflare and Traefik (see
  # server/utils/clientIp.util.js).
  TRUST_PROXY: "1"
  # Addresses that skip throttling entirely, for load tests and synthetic
  # probes. Empty = nobody bypasses. Set it to the load generator's egress IP
  # for the duration of a run; everything else stays rate limited.
  # Temporary: tn-loadgen in hel1 during the prod latency baseline. Remove
  # once the run is done — a stale allowlist entry is a standing bypass.
  # Temporary: tn-loadgen in hel1 during the prod latency baseline. Both
  # address families are listed because the generator prefers IPv6 egress
  # (Cloudflare publishes AAAA), so an IPv4-only entry silently does nothing.
  RATE_LIMIT_ALLOWLIST: "2.29.55.176,2a01:4f9:c015:d9b::/64"
