apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  annotations:
    # Run migrations before the new API pods roll out. Argo CD waits for the
    # Job to succeed before applying the rest of the sync.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # Rewritten to docker.io/leducphuong/travelnest-api:<tag> by the
          # overlay's kustomize `images:` entry (and by Argo CD Image Updater).
          image: travelnest-api:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "migrate:production"]
          env:
            - name: NODE_ENV
              value: production
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
