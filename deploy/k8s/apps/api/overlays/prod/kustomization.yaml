apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travelnest
resources:
  - ../../base
  - configmap.yaml
  - ingress.yaml
  - migration-job.yaml
images:
  - name: travelnest-api
    newName: docker.io/leducphuong/travelnest-api
    # Managed by Argo CD Image Updater: rewritten to an immutable
    # sha-<commit> tag. Do not hand-edit unless Image Updater is disabled.
    newTag: sha-3360c3a
generators:
  - secret-generator.yaml
