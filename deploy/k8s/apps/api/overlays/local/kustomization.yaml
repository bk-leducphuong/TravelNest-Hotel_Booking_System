apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travelnest
resources:
  - ../../base
  - configmap.yaml
  - ingress.yaml
images:
  - name: travelnest-api
    newName: docker.io/leducphuong/travelnest-api
    # Local dev tracks the CI-built 'develop' tag ('latest' is master-only).
    newTag: develop

generators:
  - secret-generator.yaml
