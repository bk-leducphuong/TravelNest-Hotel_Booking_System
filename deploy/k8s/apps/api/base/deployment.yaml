apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  annotations:
    # Roll pods when a referenced ConfigMap/Secret changes — env-var secrets do
    # not hot-reload. See deploy/k8s/infra/reloader.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: travelnest-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          ports:
            - containerPort: 3000
              name: http
          # Give the app time to bring up (it now retries MySQL with backoff
          # instead of exiting) before liveness/readiness start failing it.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
