apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-remote-config
type: Opaque
stringData:
  # Grafana Cloud credentials for the k8s-monitoring stack. The token (`glc_…`)
  # is injected into Alloy as GCLOUD_RW_API_KEY and used for Prometheus remote
  # write; `username` keeps the stack id for Grafana/Fleet tooling. See
  # deploy/k8s/monitoring/values.yaml.
  username: "${GRAFANA_CLOUD_USERNAME}"
  password: "${GRAFANA_CLOUD_TOKEN}"
