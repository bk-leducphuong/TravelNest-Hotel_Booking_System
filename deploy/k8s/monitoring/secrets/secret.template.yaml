apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-remote-config
type: Opaque
stringData:
  # Password (the Grafana Cloud token) for the Alloy Fleet-Management
  # remote-config endpoint. Referenced by the k8s-monitoring chart via
  # collectorCommon.alloy.remoteConfig.secret + auth.passwordKey.
  password: ${GRAFANA_CLOUD_TOKEN}
