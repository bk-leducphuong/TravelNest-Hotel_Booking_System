apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-remote-config
type: Opaque
stringData:
  # Credentials for the Alloy Fleet-Management remote-config endpoint, read by
  # the k8s-monitoring chart via collectorCommon.alloy.remoteConfig
  # (auth.type=basic, passwordKey=usernameKey=...). The username is the Grafana
  # Cloud stack id; the password is the Cloud token.
  username: ${GRAFANA_CLOUD_USERNAME}
  password: ${GRAFANA_CLOUD_TOKEN}
