apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      # Bitnami MinIO runs as UID 1001 (GID 0); fsGroup makes the PVC writable.
      securityContext:
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 1001
      containers:
        - name: minio
          # Upstream minio/minio images are no longer anonymously pullable:
          # the Docker Hub repo was removed and quay.io now requires auth.
          # Bitnami's legacy MinIO image ships the same MinIO server binary and
          # is configured purely via MINIO_* env vars, so it is a drop-in.
          image: docker.io/bitnamilegacy/minio:latest
          imagePullPolicy: IfNotPresent
          # NOTE: the Bitnami entrypoint builds `minio server <MINIO_DATA_DIR>`
          # itself and appends any args, so no `args:` are set here.
          env:
            - name: MINIO_DATA_DIR
              value: /data
            # Auto-create the bucket the media service expects (matches the
            # MINIO_BUCKET value in the sealed minio/app secrets).
            - name: MINIO_DEFAULT_BUCKETS
              value: uploads
          envFrom:
            - secretRef:
                name: minio-secret
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
