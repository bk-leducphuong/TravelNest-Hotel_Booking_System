# stakater/reloader — rolls a workload when a Secret/ConfigMap it references
# changes. Kubernetes does not restart pods when env-var Secret/ConfigMap values
# change, so without this a rotated sealed secret leaves the running pod on the
# old credentials until someone restarts it by hand (which is how the analytics
# service ended up talking to an authenticated MongoDB/Redis with no password).
#
# Workloads opt in with `reloader.stakater.com/auto: "true"`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader-reloader
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: reloader-reloader
  template:
    metadata:
      labels:
        app: reloader-reloader
    spec:
      serviceAccountName: reloader-reloader
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reloader-reloader
          image: ghcr.io/stakater/reloader:v1.4.22
          imagePullPolicy: IfNotPresent
          env:
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  divisor: '1'
                  resource: limits.cpu
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  divisor: '1'
                  resource: limits.memory
            - name: RELOADER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELOADER_DEPLOYMENT_NAME
              value: reloader-reloader
          ports:
            - containerPort: 9090
              name: http
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext: {}
