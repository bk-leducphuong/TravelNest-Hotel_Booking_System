apiVersion: v1
kind: Secret
metadata:
  name: backup-secret
type: Opaque
stringData:
  # S3 credentials for the nightly MySQL dump upload. Kept separate from
  # minio-secret so the CronJob keeps working after MinIO is decommissioned.
  AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: auto
  S3_ENDPOINT: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
