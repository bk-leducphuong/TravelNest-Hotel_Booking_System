apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travelnest
resources:
  - ../../base
generators:
  - secret-generator.yaml
# The quick seed inserts ~50k hotel_amenities and ~600k room_inventory rows;
# the base 1Gi limit gets OOMKilled partway through.
patches:
  - target:
      kind: StatefulSet
      name: mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 3Gi
