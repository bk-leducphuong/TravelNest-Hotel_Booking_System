apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travelnest
resources:
  - ../../base
  - ingress.yaml

# Same theme-baked image as prod. Local docker-compose mounts
# server/infra/keycloak/themes directly, but the k3d overlay does not.
images:
  - name: quay.io/keycloak/keycloak
    newName: docker.io/leducphuong/travelnest-keycloak
    newTag: latest

generators:
  - secret-generator.yaml

# Import the TravelNest realm on startup so the SPA can authenticate locally.
# (The prod overlay imports its own prod-hostname realm — see ./overlays/prod.)
configMapGenerator:
  - name: keycloak-realm
    files:
      - travelnest-realm.json
    options:
      disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --import-realm
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: realm-import
            mountPath: /opt/keycloak/data/import
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: realm-import
            configMap:
              name: keycloak-realm
