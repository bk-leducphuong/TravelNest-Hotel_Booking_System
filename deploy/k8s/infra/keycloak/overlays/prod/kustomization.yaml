apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travelnest
resources:
  - ../../base
  - ingress.yaml
  - db-init-job.yaml
  - realm-reconcile-job.yaml

# The stock quay.io image has no TravelNest themes; .github/workflows/keycloak.yml
# bakes server/infra/keycloak/themes into this image. Without this override the
# realm's `login_theme` values fall back to the built-in themes and the custom
# ones never appear under Realm settings -> Themes.
#
# `latest` is only the seed tag: the first master run of that workflow rewrites
# this to an immutable `sha-<commit>` tag (do not hand-edit it after that).
images:
  - name: quay.io/keycloak/keycloak
    newName: docker.io/leducphuong/travelnest-keycloak
    newTag: latest

generators:
  - secret-generator.yaml

# Import the TravelNest realm on startup so the SPAs (guest/admin/superadmin)
# can authenticate against this cluster. Keys it to the prod hostnames
# (deployserver.work / admin. / superadmin.) and its own clients.
#
# The realm ships WITHOUT users — provision them after the first import with:
#   node scripts/keycloak/migrate-users.js   (see server/scripts/keycloak)
# Keycloak skips import if the realm already exists, so this is idempotent but
# will not overwrite later manual changes.
configMapGenerator:
  - name: keycloak-realm
    files:
      - travelnest-realm.json
    options:
      disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --import-realm
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: realm-import
            mountPath: /opt/keycloak/data/import
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: realm-import
            configMap:
              name: keycloak-realm
      # Pin the frontend URL so tokens are always issued with the https issuer
      # the api expects (KEYCLOAK_ISSUER=https://keycloak.deployserver.work/...).
      # Without this, Keycloak derives the issuer from the (http) request to
      # Traefik and the api rejects every token ("Invalid JWT issuer").
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: KC_HOSTNAME
            value: https://keycloak.deployserver.work
