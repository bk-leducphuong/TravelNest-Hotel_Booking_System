apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
data:
  KEYCLOAK_DB_NAME: keycloak
  KEYCLOAK_DB_USER: keycloak
  KC_DB: mysql
  KC_DB_URL_HOST: mysql
  KC_DB_URL_PORT: "3306"
  KC_DB_URL_DATABASE: keycloak
  KC_HTTP_ENABLED: "true"
  KC_PROXY_HEADERS: xforwarded
  KC_HOSTNAME_STRICT: "false"
  # Build backchannel URLs (token, jwks, userinfo, introspection) from the
  # pinned https hostname rather than the in-cluster http request, so the OIDC
  # discovery document does not advertise http:// endpoints.
  KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
