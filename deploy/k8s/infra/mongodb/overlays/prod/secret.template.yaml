apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  annotations:
    # Applied before the bootstrap Job that consumes it.
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  MONGODB_USER: ${MONGODB_USER}
  MONGODB_PASSWORD: ${MONGODB_PASSWORD}
  MONGODB_DATABASE: travelnest_analytics
