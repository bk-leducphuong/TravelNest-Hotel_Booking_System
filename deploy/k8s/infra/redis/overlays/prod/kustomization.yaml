apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travelnest
resources:
  - ../../base
generators:
  - secret-generator.yaml
# Require authentication on the shared Redis (it is otherwise wide open). The
# password is injected from the sealed secret; REDISCLI_AUTH lets the
# `redis-cli ping` probes authenticate without changing the probe command.
patches:
  - target:
      kind: StatefulSet
      name: redis
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: --requirepass
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: $(REDIS_PASSWORD)
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: REDIS_PASSWORD
          - name: REDISCLI_AUTH
            valueFrom:
              secretKeyRef:
                name: redis-secret
                key: REDIS_PASSWORD
