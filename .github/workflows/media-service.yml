name: Media Service Image CI

on:
  push:
    # Only master publishes images: this repo has a single (production)
    # environment, so develop builds must not produce publishable sha-* tags.
    branches: [master]
    paths:
      - "services/media/**"
      - ".github/workflows/media-service.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "services/media/**"
      - ".github/workflows/media-service.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: media-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelnest-media

jobs:
  test:
    name: Test Media Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/media
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/media/go.mod
          cache: true
          cache-dependency-path: services/media/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

  build-and-push:
    name: Build and Push Media Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pushes the promoted tag back to master. Falls back to the default
          # token; set a PROMOTION_TOKEN repo secret (PAT with contents: write)
          # if master's protection blocks the actions token.
          token: ${{ secrets.PROMOTION_TOKEN || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pull public base images via Google's Docker Hub mirror so we stay
          # under Docker Hub's authenticated pull-rate limit (200/6h). Mirrors
          # only affect pulls; pushes and cache still go to docker.io.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push media image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./services/media
          file: ./services/media/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Promote image to prod overlay
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          deploy/scripts/ci/update-image-tag.sh deploy/k8s/apps/media/overlays/prod/kustomization.yaml travelnest-media "$TAG"
          if git diff --quiet -- deploy/k8s; then
            echo "prod overlay already at $TAG"
            exit 0
          fi
          git add deploy/k8s
          git commit -m "chore(deploy): promote travelnest-media to $TAG"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "promoted $TAG"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing on origin/master"
            git fetch origin master
            git rebase origin/master
            sleep 5
          done
          echo "error: could not push $TAG after retries" >&2
          exit 1

