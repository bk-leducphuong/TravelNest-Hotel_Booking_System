name: Notification Service Image CI

on:
  push:
    # Only master publishes images: this repo has a single (production)
    # environment, so develop builds must not produce publishable sha-* tags.
    branches: [master]
    paths:
      - "services/notification/**"
      - ".github/workflows/notification-service.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "services/notification/**"
      - ".github/workflows/notification-service.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: notification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Notification Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/notification
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/notification/go.mod
          cache: true
          cache-dependency-path: services/notification/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

  # Multi-arch (amd64 + arm64) image built on native runners and published
  # by the shared workflow; see .github/workflows/_publish-image.yml.
  build-and-push:
    name: Build and Push Notification Image
    needs: [test]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/_publish-image.yml
    with:
      image: travelnest-notification
      context: ./services/notification
      dockerfile: ./services/notification/Dockerfile
      summary_title: Notification image published
      promote_targets: |
        travelnest-notification:deploy/k8s/apps/notification/overlays/prod/kustomization.yaml
