name: Superadmin Client Image CI

on:
  push:
    # Only master publishes images: this repo has a single (production)
    # environment, so develop builds must not produce publishable sha-* tags.
    branches: [master]
    paths:
      - "superadmin-client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/superadmin-client.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "superadmin-client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/superadmin-client.yml"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: superadmin-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint, Typecheck and Build Superadmin Client (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit and Nuxt tests
        run: yarn workspace @travelnest/superadmin-client run test:ci

      - name: Run ESLint
        continue-on-error: true
        run: yarn workspace @travelnest/superadmin-client run lint

      - name: Type check
        continue-on-error: true
        run: yarn workspace @travelnest/superadmin-client run typecheck

      - name: Check formatting
        continue-on-error: true
        run: yarn workspace @travelnest/superadmin-client exec prettier --check .

      # `nuxt build` is what the Docker image runs (a Node SSR server), so CI
      # validates the same target instead of the static `nuxt generate` output.
      - name: Build app
        run: yarn workspace @travelnest/superadmin-client run build
        env:
          NODE_ENV: production

  # Multi-arch (amd64 + arm64) image built on native runners and published
  # by the shared workflow; see .github/workflows/_publish-image.yml.
  build-and-push:
    name: Build and Push Superadmin Image
    needs: [lint-and-build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/_publish-image.yml
    with:
      image: travelnest-superadmin
      context: .
      dockerfile: ./superadmin-client/Dockerfile
      summary_title: Superadmin image published
      # nuxt.config.ts reads NUXT_PUBLIC_* at build time and the platform
      # console is an SPA, so this public config is baked into the bundle.
      # `with:` values are resolved by the caller and cannot read its `env`.
      build_args: |
        NUXT_PUBLIC_API_BASE=${{ vars.NUXT_PUBLIC_API_BASE || 'https://api.deployserver.work/api/v1' }}
        NUXT_PUBLIC_KEYCLOAK_URL=${{ vars.NUXT_PUBLIC_KEYCLOAK_URL || 'https://keycloak.deployserver.work' }}
        NUXT_PUBLIC_KEYCLOAK_REALM=${{ vars.NUXT_PUBLIC_KEYCLOAK_REALM || 'travelnest' }}
        NUXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ vars.NUXT_PUBLIC_KEYCLOAK_CLIENT_ID || 'travelnest-superadmin' }}
        NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI=${{ vars.NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI || 'https://superadmin.deployserver.work/silent-check-sso.html' }}
      promote_targets: |
        travelnest-superadmin:deploy/k8s/apps/superadmin-client/overlays/prod/kustomization.yaml
