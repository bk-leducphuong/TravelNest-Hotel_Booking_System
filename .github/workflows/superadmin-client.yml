name: Superadmin Client Image CI

on:
  push:
    # Only master publishes images: this repo has a single (production)
    # environment, so develop builds must not produce publishable sha-* tags.
    branches: [master]
    paths:
      - "superadmin-client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/superadmin-client.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "superadmin-client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/superadmin-client.yml"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: superadmin-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelnest-superadmin
  # nuxt.config.ts reads NUXT_PUBLIC_* at build time; the platform console is a
  # static SPA so this public config is baked into the bundle.
  NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE || 'https://api.deployserver.work/api/v1' }}
  NUXT_PUBLIC_KEYCLOAK_URL: ${{ vars.NUXT_PUBLIC_KEYCLOAK_URL || 'https://keycloak.deployserver.work' }}
  NUXT_PUBLIC_KEYCLOAK_REALM: ${{ vars.NUXT_PUBLIC_KEYCLOAK_REALM || 'travelnest' }}
  NUXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${{ vars.NUXT_PUBLIC_KEYCLOAK_CLIENT_ID || 'travelnest-superadmin' }}
  NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI: ${{ vars.NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI || 'https://superadmin.deployserver.work/silent-check-sso.html' }}

jobs:
  lint-and-build:
    name: Lint, Typecheck and Build Superadmin Client (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit and Nuxt tests
        run: yarn workspace @travelnest/superadmin-client run test:ci

      - name: Run ESLint
        continue-on-error: true
        run: yarn workspace @travelnest/superadmin-client run lint

      - name: Type check
        continue-on-error: true
        run: yarn workspace @travelnest/superadmin-client run typecheck

      - name: Check formatting
        continue-on-error: true
        run: yarn workspace @travelnest/superadmin-client exec prettier --check .

      # `nuxt build` is what the Docker image runs (a Node SSR server), so CI
      # validates the same target instead of the static `nuxt generate` output.
      - name: Build app
        run: yarn workspace @travelnest/superadmin-client run build
        env:
          NODE_ENV: production

  build-and-push:
    name: Build and Push Superadmin Image
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pushes the promoted tag back to master. Falls back to the default
          # token; set a PROMOTION_TOKEN repo secret (PAT with contents: write)
          # if master's protection blocks the actions token.
          token: ${{ secrets.PROMOTION_TOKEN || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pull public base images via Google's Docker Hub mirror so we stay
          # under Docker Hub's authenticated pull-rate limit (200/6h). Mirrors
          # only affect pulls; pushes and cache still go to docker.io.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push superadmin image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./superadmin-client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_API_BASE=${{ env.NUXT_PUBLIC_API_BASE }}
            NUXT_PUBLIC_KEYCLOAK_URL=${{ env.NUXT_PUBLIC_KEYCLOAK_URL }}
            NUXT_PUBLIC_KEYCLOAK_REALM=${{ env.NUXT_PUBLIC_KEYCLOAK_REALM }}
            NUXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ env.NUXT_PUBLIC_KEYCLOAK_CLIENT_ID }}
            NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI=${{ env.NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Promote image to prod overlay
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          deploy/scripts/ci/update-image-tag.sh deploy/k8s/apps/superadmin-client/overlays/prod/kustomization.yaml travelnest-superadmin "$TAG"
          if git diff --quiet -- deploy/k8s; then
            echo "prod overlay already at $TAG"
            exit 0
          fi
          git add deploy/k8s
          git commit -m "chore(deploy): promote travelnest-superadmin to $TAG"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "promoted $TAG"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing on origin/master"
            git fetch origin master
            git rebase origin/master
            sleep 5
          done
          echo "error: could not push $TAG after retries" >&2
          exit 1

      - name: Build summary
        run: |
          echo "## Superadmin image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI promotes the immutable \`sha-*\` tag into the prod overlay on master; Argo CD auto-syncs the rollout." >> "$GITHUB_STEP_SUMMARY"
