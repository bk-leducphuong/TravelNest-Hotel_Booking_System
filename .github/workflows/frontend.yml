name: Frontend Image CI

on:
  push:
    # Only master publishes images: this repo has a single (production)
    # environment, so develop builds must not produce publishable sha-* tags.
    branches: [master]
    paths:
      - "client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/frontend.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: yarn install --immutable

      # TODO(quality-debt): pre-existing lint/format failures; advisory so
      # deploys are not blocked. Remove `continue-on-error` once cleared.
      - name: Run ESLint
        continue-on-error: true
        run: yarn workspace @travelnest/client run lint

      - name: Check formatting
        continue-on-error: true
        run: yarn workspace @travelnest/client exec prettier --check "src/**/*.{js,vue,json,css,scss}"

      - name: Build app
        run: yarn workspace @travelnest/client run build
        env:
          NODE_ENV: production

  preview-validation:
    name: Validate Preview Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-24.x-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-24.x-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build preview
        run: yarn workspace @travelnest/client run build
        env:
          NODE_ENV: production

      - name: Smoke-test the preview server
        run: |
          set -euo pipefail
          yarn workspace @travelnest/client exec vite preview --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4173 >/dev/null; then
              echo "Preview server responded on attempt ${attempt}."
              exit 0
            fi
            sleep 2
          done
          echo "Preview server did not become ready in time." >&2
          exit 1

  # Multi-arch (amd64 + arm64) image built on native runners and published
  # by the shared workflow; see .github/workflows/_publish-image.yml.
  build-and-push:
    name: Build and Push Frontend Image
    needs: [lint-and-build, preview-validation]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/_publish-image.yml
    with:
      image: travelnest-frontend
      context: .
      dockerfile: ./client/Dockerfile
      summary_title: Frontend image published
      # Baked into the bundle at build time; override with repository
      # variables (Settings > Variables). `with:` values are resolved by the
      # caller and cannot read its `env`, so the defaults live inline here.
      build_args: |
        VITE_SERVER_HOST=${{ vars.VITE_SERVER_HOST || 'https://api.deployserver.work' }}
        VITE_MINIO_URL=${{ vars.VITE_MINIO_URL || 'https://storage.deployserver.work/uploads/' }}
        VITE_ADMIN_HOST=${{ vars.VITE_ADMIN_HOST || 'https://admin.deployserver.work' }}
        VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL || 'https://keycloak.deployserver.work' }}
        VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM || 'travelnest' }}
        VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID || 'travelnest-web' }}
        VITE_STRIPE_PUBLIC_KEY=${{ vars.VITE_STRIPE_PUBLIC_KEY || 'pk_test_51T4DQCC8yETwFKHFA9dsnMKy9rJmWzBLTvvDViuizhwPUrGCgbn5GvuqzSAJjqBl3pWarb8XF4rDFhrdeteJ31PP00EfeNIVyd' }}
      promote_targets: |
        travelnest-frontend:deploy/k8s/apps/frontend/overlays/prod/kustomization.yaml
