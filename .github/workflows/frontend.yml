name: Frontend Image CI

on:
  push:
    branches: [master, develop, staging]
    paths:
      - "client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".github/workflows/frontend.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelnest-frontend
  # Baked into the bundle at build time. Override with a repository variable
  # (Settings > Variables) without touching this file.
  VITE_SERVER_HOST: ${{ vars.VITE_SERVER_HOST || 'https://api.deployserver.work' }}
  VITE_MINIO_URL: ${{ vars.VITE_MINIO_URL || 'https://storage.deployserver.work/uploads/' }}
  # Required by client/src/services/keycloak.service.js. Without these the SPA
  # throws on login; local builds override them with the local hostnames.
  VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL || 'https://keycloak.deployserver.work' }}
  VITE_KEYCLOAK_REALM: ${{ vars.VITE_KEYCLOAK_REALM || 'travelnest' }}
  VITE_KEYCLOAK_CLIENT_ID: ${{ vars.VITE_KEYCLOAK_CLIENT_ID || 'travelnest-web' }}

jobs:
  lint-and-build:
    name: Lint and Build Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: yarn install --immutable

      # TODO(quality-debt): pre-existing lint/format failures; advisory so
      # deploys are not blocked. Remove `continue-on-error` once cleared.
      - name: Run ESLint
        continue-on-error: true
        run: yarn workspace @travelnest/client run lint

      - name: Check formatting
        continue-on-error: true
        run: yarn workspace @travelnest/client exec prettier --check "src/**/*.{js,vue,json,css,scss}"

      - name: Build app
        run: yarn workspace @travelnest/client run build
        env:
          NODE_ENV: production

  preview-validation:
    name: Validate Preview Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-24.x-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-24.x-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build preview
        run: yarn workspace @travelnest/client run build
        env:
          NODE_ENV: production

      - name: Smoke-test the preview server
        run: |
          set -euo pipefail
          yarn workspace @travelnest/client exec vite preview --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4173 >/dev/null; then
              echo "Preview server responded on attempt ${attempt}."
              exit 0
            fi
            sleep 2
          done
          echo "Preview server did not become ready in time." >&2
          exit 1

  build-and-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs: [lint-and-build, preview-validation]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SERVER_HOST=${{ env.VITE_SERVER_HOST }}
            VITE_MINIO_URL=${{ env.VITE_MINIO_URL }}
            VITE_KEYCLOAK_URL=${{ env.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ env.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ env.VITE_KEYCLOAK_CLIENT_ID }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64

      - name: Build summary
        run: |
          echo "## Frontend image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Argo CD Image Updater promotes the immutable \`sha-*\` tag to prod; no manual tag edit needed." >> "$GITHUB_STEP_SUMMARY"
