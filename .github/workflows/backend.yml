name: Backend Image CI

on:
  push:
    # Only master publishes images: this repo has a single (production)
    # environment, so develop builds must not produce publishable sha-* tags.
    branches: [master]
    paths:
      - "server/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "server/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  release:
    types: [published]
  workflow_dispatch:

# Avoid two runs racing on the same mutable tags (e.g. master-sha / latest).
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelnest-api

jobs:
  lint-and-test:
    name: Lint and Test Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ matrix.node-version }}-

      # The repo is a Yarn Berry workspaces monorepo: install once from the
      # root against the committed yarn.lock, then run workspace scripts.
      - name: Install dependencies
        run: yarn install --immutable

      # Lint and formatting are blocking: the repository is clean and these must
      # stay clean. If a change introduces an error, fix it rather than disabling
      # the gate.
      - name: Run ESLint
        run: yarn workspace @travelnest/server run lint

      - name: Check code formatting
        run: yarn workspace @travelnest/server exec prettier --check .

      # Architecture ratchet: fails on new cross-module internal imports, new
      # layer leaks, or growing god files. Existing debt is recorded in
      # server/scripts/architecture-baseline.json and may only go down.
      - name: Check architecture boundaries
        run: yarn workspace @travelnest/server run arch:check

      # TODO(quality-debt): the unit/integration suites still have pre-existing
      # failures (7 unit tests across the auth/hold/hotel suites). These gates
      # stay advisory so image builds are not blocked; remove `continue-on-error`
      # once that debt is cleared.
      - name: Run unit tests
        continue-on-error: true
        run: yarn workspace @travelnest/server run test:unit
        env:
          NODE_ENV: development
          SESSION_SECRET: test_session_secret_for_ci
          SESSION_SECRET_KEY: test_session_secret_for_ci

      - name: Run integration tests
        continue-on-error: true
        run: yarn workspace @travelnest/server run test:integration
        timeout-minutes: 15
        env:
          NODE_ENV: development
          SESSION_SECRET: test_session_secret_for_ci
          SESSION_SECRET_KEY: test_session_secret_for_ci

      - name: Generate coverage report
        continue-on-error: true
        if: matrix.node-version == '24.x'
        run: yarn workspace @travelnest/server run test:coverage
        timeout-minutes: 15
        env:
          NODE_ENV: development
          SESSION_SECRET: test_session_secret_for_ci
          SESSION_SECRET_KEY: test_session_secret_for_ci

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node-version == '24.x'
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 7

  schema-drift:
    name: Schema Drift (migrations vs models)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travelnest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Fails if a model change landed without a migration: migrations and
      # `sequelize.sync()` must produce the same schema. This is a blocking gate
      # so the schema cannot silently drift again.
      - name: Check schema drift
        run: yarn workspace @travelnest/server run schema:check
        timeout-minutes: 10
        env:
          NODE_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: travelnest
          DB_USER: root
          DB_PASSWORD: root

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # Advisory until the existing advisories are triaged.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run dependency audit
        run: yarn npm audit --severity high --recursive

  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: [lint-and-test, schema-drift]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pushes the promoted tag back to master. Falls back to the default
          # token; set a PROMOTION_TOKEN repo secret (PAT with contents: write)
          # if master's protection blocks the actions token.
          token: ${{ secrets.PROMOTION_TOKEN || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pull public base images via Google's Docker Hub mirror so we stay
          # under Docker Hub's authenticated pull-rate limit (200/6h). Mirrors
          # only affect pulls; pushes and cache still go to docker.io.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # context is the repo root because the Dockerfile copies `server/...`.
      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./server/infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Promote image to prod overlay
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          deploy/scripts/ci/update-image-tag.sh deploy/k8s/apps/api/overlays/prod/kustomization.yaml travelnest-api "$TAG"
          deploy/scripts/ci/update-image-tag.sh deploy/k8s/apps/worker/overlays/prod/kustomization.yaml travelnest-api "$TAG"
          if git diff --quiet -- deploy/k8s; then
            echo "prod overlay already at $TAG"
            exit 0
          fi
          git add deploy/k8s
          git commit -m "chore(deploy): promote travelnest-api to $TAG"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "promoted $TAG"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing on origin/master"
            git fetch origin master
            git rebase origin/master
            sleep 5
          done
          echo "error: could not push $TAG after retries" >&2
          exit 1

      - name: Build summary
        run: |
          echo "## Backend image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI promotes the immutable \`sha-*\` tag into the prod overlay on master; Argo CD auto-syncs the rollout." >> "$GITHUB_STEP_SUMMARY"
