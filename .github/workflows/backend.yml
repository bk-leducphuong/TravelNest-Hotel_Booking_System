name: Backend Image CI

on:
  push:
    # Only master publishes images: this repo has a single (production)
    # environment, so develop builds must not produce publishable sha-* tags.
    branches: [master]
    paths:
      - "server/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "server/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/backend.yml"
  release:
    types: [published]
  workflow_dispatch:

# Avoid two runs racing on the same mutable tags (e.g. master-sha / latest).
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and Test Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ matrix.node-version }}-

      # The repo is a Yarn Berry workspaces monorepo: install once from the
      # root against the committed yarn.lock, then run workspace scripts.
      - name: Install dependencies
        run: yarn install --immutable

      # Lint and formatting are blocking: the repository is clean and these must
      # stay clean. If a change introduces an error, fix it rather than disabling
      # the gate.
      - name: Run ESLint
        run: yarn workspace @travelnest/server run lint

      - name: Check code formatting
        run: yarn workspace @travelnest/server exec prettier --check .

      # Architecture ratchet: fails on new cross-module internal imports, new
      # layer leaks, or growing god files. Existing debt is recorded in
      # server/scripts/architecture-baseline.json and may only go down.
      - name: Check architecture boundaries
        run: yarn workspace @travelnest/server run arch:check

      # TODO(quality-debt): the unit/integration suites still have pre-existing
      # failures (7 unit tests across the auth/hold/hotel suites). These gates
      # stay advisory so image builds are not blocked; remove `continue-on-error`
      # once that debt is cleared.
      - name: Run unit tests
        continue-on-error: true
        run: yarn workspace @travelnest/server run test:unit
        env:
          NODE_ENV: development
          SESSION_SECRET: test_session_secret_for_ci
          SESSION_SECRET_KEY: test_session_secret_for_ci

      - name: Run integration tests
        continue-on-error: true
        run: yarn workspace @travelnest/server run test:integration
        timeout-minutes: 15
        env:
          NODE_ENV: development
          SESSION_SECRET: test_session_secret_for_ci
          SESSION_SECRET_KEY: test_session_secret_for_ci

      - name: Generate coverage report
        continue-on-error: true
        if: matrix.node-version == '24.x'
        run: yarn workspace @travelnest/server run test:coverage
        timeout-minutes: 15
        env:
          NODE_ENV: development
          SESSION_SECRET: test_session_secret_for_ci
          SESSION_SECRET_KEY: test_session_secret_for_ci

      - name: Upload coverage report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: matrix.node-version == '24.x'
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 7

  schema-drift:
    name: Schema Drift (migrations vs models)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travelnest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Fails if a model change landed without a migration: migrations and
      # `sequelize.sync()` must produce the same schema. This is a blocking gate
      # so the schema cannot silently drift again.
      - name: Check schema drift
        run: yarn workspace @travelnest/server run schema:check
        timeout-minutes: 10
        env:
          NODE_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: travelnest
          DB_USER: root
          DB_PASSWORD: root

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # Advisory until the existing advisories are triaged.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run dependency audit
        run: yarn npm audit --severity high --recursive

  # Multi-arch (amd64 + arm64) image built on native runners and published
  # by the shared workflow; see .github/workflows/_publish-image.yml.
  build-and-push:
    name: Build and Push Backend Image
    needs: [lint-and-test, schema-drift]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/_publish-image.yml
    with:
      image: travelnest-api
      context: .
      dockerfile: ./server/infra/Dockerfile
      summary_title: Backend image published
      # api and worker run the same image, so both overlays are promoted together.
      promote_targets: |
        travelnest-api:deploy/k8s/apps/api/overlays/prod/kustomization.yaml
        travelnest-api:deploy/k8s/apps/worker/overlays/prod/kustomization.yaml
