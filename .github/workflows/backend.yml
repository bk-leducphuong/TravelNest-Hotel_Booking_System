name: Backend Image CI

on:
  push:
    branches: [master, develop, staging]
    paths:
      - "server/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "server/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".github/workflows/backend.yml"
  release:
    types: [published]
  workflow_dispatch:

# Avoid two runs racing on the same mutable tags (e.g. master-sha / latest).
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelnest-api

jobs:
  lint-and-test:
    name: Lint and Test Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ matrix.node-version }}-

      # The repo is a Yarn Berry workspaces monorepo: install once from the
      # root against the committed yarn.lock, then run workspace scripts.
      - name: Install dependencies
        run: yarn install --immutable

      # Lint and formatting are blocking: the repository is clean and these must
      # stay clean. If a change introduces an error, fix it rather than disabling
      # the gate.
      - name: Run ESLint
        run: yarn workspace @travelnest/server run lint

      - name: Check code formatting
        run: yarn workspace @travelnest/server exec prettier --check .

      # Architecture ratchet: fails on new cross-module internal imports, new
      # layer leaks, or growing god files. Existing debt is recorded in
      # server/scripts/architecture-baseline.json and may only go down.
      - name: Check architecture boundaries
        run: yarn workspace @travelnest/server run arch:check

      # TODO(quality-debt): the unit/integration suites still have pre-existing
      # failures (7 unit tests across the auth/hold/hotel suites). These gates
      # stay advisory so image builds are not blocked; remove `continue-on-error`
      # once that debt is cleared.
      - name: Run unit tests
        continue-on-error: true
        run: yarn workspace @travelnest/server run test:unit
        env:
          NODE_ENV: development
          SESSION_SECRET: test_session_secret_for_ci
          SESSION_SECRET_KEY: test_session_secret_for_ci

      - name: Run integration tests
        continue-on-error: true
        run: yarn workspace @travelnest/server run test:integration
        timeout-minutes: 15
        env:
          NODE_ENV: development
          SESSION_SECRET: test_session_secret_for_ci
          SESSION_SECRET_KEY: test_session_secret_for_ci

      - name: Generate coverage report
        continue-on-error: true
        if: matrix.node-version == '24.x'
        run: yarn workspace @travelnest/server run test:coverage
        timeout-minutes: 15
        env:
          NODE_ENV: development
          SESSION_SECRET: test_session_secret_for_ci
          SESSION_SECRET_KEY: test_session_secret_for_ci

      - name: Upload coverage report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: matrix.node-version == '24.x'
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 7

  schema-drift:
    name: Schema Drift (migrations vs models)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travelnest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Fails if a model change landed without a migration: migrations and
      # `sequelize.sync()` must produce the same schema. This is a blocking gate
      # so the schema cannot silently drift again.
      - name: Check schema drift
        run: yarn workspace @travelnest/server run schema:check
        timeout-minutes: 10
        env:
          NODE_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: travelnest
          DB_USER: root
          DB_PASSWORD: root

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # Advisory until the existing advisories are triaged.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run dependency audit
        run: yarn npm audit --severity high --recursive

  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: [lint-and-test, schema-drift]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # context is the repo root because the Dockerfile copies `server/...`.
      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./server/infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64

      - name: Build summary
        run: |
          echo "## Backend image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Argo CD Image Updater promotes the immutable \`sha-*\` tag to prod; no manual tag edit needed." >> "$GITHUB_STEP_SUMMARY"
