name: Admin Client Image CI

on:
  push:
    # Only master publishes images: this repo has a single (production)
    # environment, so develop builds must not produce publishable sha-* tags.
    branches: [master]
    paths:
      - "admin-client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/admin-client.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "admin-client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/admin-client.yml"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: admin-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint, Typecheck and Build Admin Client (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit and Nuxt tests
        run: yarn workspace @travelnest/admin-client run test:ci

      - name: Run ESLint
        run: yarn workspace @travelnest/admin-client run lint

      - name: Type check
        run: yarn workspace @travelnest/admin-client run typecheck

      - name: Install browser test dependencies
        if: matrix.node-version == '22.x'
        run: yarn workspace @travelnest/admin-client exec playwright install --with-deps chromium

      - name: Verify console workflows and accessibility
        if: matrix.node-version == '22.x'
        run: yarn workspace @travelnest/admin-client run test:browser

      # Formatting debt outside this redesign remains advisory.
      - name: Check formatting
        continue-on-error: true
        run: yarn workspace @travelnest/admin-client exec prettier --check .

      # `nuxt build` is what the Docker image runs (a Node SSR server), so CI
      # validates the same target instead of the static `nuxt generate` output.
      - name: Build app
        run: yarn workspace @travelnest/admin-client run build
        env:
          NODE_ENV: production

  # Multi-arch (amd64 + arm64) image built on native runners and published
  # by the shared workflow; see .github/workflows/_publish-image.yml.
  build-and-push:
    name: Build and Push Admin Image
    needs: [lint-and-build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/_publish-image.yml
    with:
      image: travelnest-admin
      context: .
      dockerfile: ./admin-client/Dockerfile
      summary_title: Admin image published
      # nuxt.config.ts reads NUXT_PUBLIC_* at build time and the admin client
      # is an SPA, so this public config is baked into the bundle. `with:`
      # values are resolved by the caller and cannot read its `env`.
      build_args: |
        NUXT_PUBLIC_API_BASE=${{ vars.NUXT_PUBLIC_API_BASE || 'https://api.deployserver.work/api/v1' }}
        NUXT_PUBLIC_MEDIA_BASE=${{ vars.NUXT_PUBLIC_MEDIA_BASE || vars.VITE_MINIO_URL || 'https://storage.deployserver.work/uploads/' }}
        NUXT_PUBLIC_KEYCLOAK_URL=${{ vars.NUXT_PUBLIC_KEYCLOAK_URL || 'https://keycloak.deployserver.work' }}
        NUXT_PUBLIC_KEYCLOAK_REALM=${{ vars.NUXT_PUBLIC_KEYCLOAK_REALM || 'travelnest' }}
        NUXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ vars.NUXT_PUBLIC_KEYCLOAK_CLIENT_ID || 'travelnest-admin' }}
        NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI=${{ vars.NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI || 'https://admin.deployserver.work/silent-check-sso.html' }}
      promote_targets: |
        travelnest-admin:deploy/k8s/apps/admin-client/overlays/prod/kustomization.yaml
