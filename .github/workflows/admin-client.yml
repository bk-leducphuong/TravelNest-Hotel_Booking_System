name: Admin Client Image CI

on:
  push:
    # Only master publishes images: this repo has a single (production)
    # environment, so develop builds must not produce publishable sha-* tags.
    branches: [master]
    paths:
      - "admin-client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/admin-client.yml"
  pull_request:
    branches: [master, develop, staging]
    paths:
      - "admin-client/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".dockerignore"
      - ".github/workflows/admin-client.yml"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: admin-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travelnest-admin
  # nuxt.config.ts reads NUXT_PUBLIC_* at build time; the admin client is a
  # static SPA so this public config is baked into the bundle.
  NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE || 'https://api.deployserver.work/api/v1' }}
  NUXT_PUBLIC_KEYCLOAK_URL: ${{ vars.NUXT_PUBLIC_KEYCLOAK_URL || 'https://keycloak.deployserver.work' }}
  NUXT_PUBLIC_KEYCLOAK_REALM: ${{ vars.NUXT_PUBLIC_KEYCLOAK_REALM || 'travelnest' }}
  NUXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${{ vars.NUXT_PUBLIC_KEYCLOAK_CLIENT_ID || 'travelnest-admin' }}
  NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI: ${{ vars.NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI || 'https://admin.deployserver.work/silent-check-sso.html' }}

jobs:
  lint-and-build:
    name: Lint, Typecheck and Build Admin Client (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit and Nuxt tests
        run: yarn workspace @travelnest/admin-client run test:ci

      # TODO(quality-debt): pre-existing lint/format failures; advisory so
      # deploys are not blocked. Remove `continue-on-error` once cleared.
      - name: Run ESLint
        continue-on-error: true
        run: yarn workspace @travelnest/admin-client run lint

      # TODO(quality-debt): `vue-tsc` cannot run because admin-client does not
      # declare `typescript` as a devDependency. Add it, fix the type errors,
      # then remove `continue-on-error`.
      - name: Type check
        continue-on-error: true
        run: yarn workspace @travelnest/admin-client run typecheck

      - name: Check formatting
        continue-on-error: true
        run: yarn workspace @travelnest/admin-client exec prettier --check .

      # `nuxt build` is what the Docker image runs (a Node SSR server), so CI
      # validates the same target instead of the static `nuxt generate` output.
      - name: Build app
        run: yarn workspace @travelnest/admin-client run build
        env:
          NODE_ENV: production

  build-and-push:
    name: Build and Push Admin Image
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # Pushes the promoted tag back to master. Falls back to the default
          # token; set a PROMOTION_TOKEN repo secret (PAT with contents: write)
          # if master's protection blocks the actions token.
          token: ${{ secrets.PROMOTION_TOKEN || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
        with:
          # Pull public base images via Google's Docker Hub mirror so we stay
          # under Docker Hub's authenticated pull-rate limit (200/6h). Mirrors
          # only affect pulls; pushes and cache still go to docker.io.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push admin image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./admin-client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_API_BASE=${{ env.NUXT_PUBLIC_API_BASE }}
            NUXT_PUBLIC_KEYCLOAK_URL=${{ env.NUXT_PUBLIC_KEYCLOAK_URL }}
            NUXT_PUBLIC_KEYCLOAK_REALM=${{ env.NUXT_PUBLIC_KEYCLOAK_REALM }}
            NUXT_PUBLIC_KEYCLOAK_CLIENT_ID=${{ env.NUXT_PUBLIC_KEYCLOAK_CLIENT_ID }}
            NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI=${{ env.NUXT_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO_REDIRECT_URI }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Promote image to prod overlay
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          deploy/scripts/ci/update-image-tag.sh deploy/k8s/apps/admin-client/overlays/prod/kustomization.yaml travelnest-admin "$TAG"
          if git diff --quiet -- deploy/k8s; then
            echo "prod overlay already at $TAG"
            exit 0
          fi
          git add deploy/k8s
          git commit -m "chore(deploy): promote travelnest-admin to $TAG"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "promoted $TAG"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing on origin/master"
            git fetch origin master
            git rebase origin/master
            sleep 5
          done
          echo "error: could not push $TAG after retries" >&2
          exit 1

      - name: Build summary
        run: |
          echo "## Admin image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI promotes the immutable \`sha-*\` tag into the prod overlay on master; Argo CD auto-syncs the rollout." >> "$GITHUB_STEP_SUMMARY"
